name = "nwflash-web"
main = "src/index.ts"
compatibility_date = "2026-08-13"

# 管理后台静态资源仅作为构建期 Text module 装载;公开授权仍由 src/index.ts 的封闭 manifest 决定。
rules = [
  { type = "Text", globs = ["**/*.html", "**/*.css"], fallthrough = true },
  { type = "Text", globs = ["**/admin/*.js", "**/admin/**/*.js"], fallthrough = false }
]

[[d1_databases]]
binding = "DB"
database_name = "nwflash-db"
database_id = "a35d1ea1-620f-436c-9eb5-7f58312c1cf6"

# 自定义域:web.nwflash.cc.cd(域名 nwflash.cc.cd 需已在 Cloudflare)
[[routes]]
pattern = "web.nwflash.cc.cd"
custom_domain = true

[vars]
# 在线判定窗口(ms):与 api worker 保持一致。默认 120000。
ONLINE_TIMEOUT_MS = "120000"
