name = "nwflash-rom"
main = "src/index.ts"
compatibility_date = "2026-08-13"

[[d1_databases]]
binding = "DB"
database_name = "nwflash-db"
database_id = "a35d1ea1-620f-436c-9eb5-7f58312c1cf6"

# 变量(非机密)。生产机密必须用 `wrangler secret put` 设置,不得写入本文件:
# - VOTA_API_TOKEN
# - SESSION_SIGNING_PRIVATE_KEY_PKCS8(无填充 base64url PKCS#8 Ed25519 private-key DER)
# `npm run deploy` 会先读取远端 secret 清单;缺少签名 secret 时部署预检失败。
[vars]
VOTA_BASE_URL = "https://api.otau.cc.cd"
VOTA_ACTION = "resolve_url"
VOTA_VER = "0.1.0"
# 心跳写节流(ms):同一会话 last_seen 至少隔这么久才写一次 D1。默认 60000。
HEARTBEAT_WRITE_INTERVAL_MS = "60000"
# 在线判定窗口(ms):last_seen 在此窗口内的会话视为在线。默认 120000。
ONLINE_TIMEOUT_MS = "120000"
# 每用户同时在线会话数上限。默认 3。
ONLINE_SESSION_CAP = "3"

# Cron:在线会话 stale 行兜底清理 + 完整性遥测限流窗口清理。
[triggers]
crons = ["*/3 * * * *"]

# 自定义域:api.nwflash.cc.cd(域名 nwflash.cc.cd 需已在 Cloudflare)。
# 首次 deploy 前确保域名在账户里;wrangler 会自动创建 DNS 与证书。
[[routes]]
pattern = "api.nwflash.cc.cd"
custom_domain = true
