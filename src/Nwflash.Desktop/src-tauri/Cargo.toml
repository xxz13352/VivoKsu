[package]
name = "nwflash-desktop"
version = "1.0.2"
edition = "2021"
description = "奶蛙Flash Desktop Workspace Root"

[workspace]
members = [
  "crates/nwflash-domain",
  "crates/nwflash-protection",
  "crates/nwflash-application",
  "crates/nwflash-infrastructure",
  "crates/nwflash-windows",
  "crates/nwflash-tauri",
]
resolver = "2"

# P3：FFI / unsafe 边界的 lint 门禁。
#
# 本项目**没有 cdylib、也没有任何 extern "C" 导出**（见 P3 调研结论），
# 因此任务书要求的 catch_unwind 包裹与 #[repr(C)] 传输没有可实施对象。
# 能真正落地的是"防止未来引入不安全的 FFI 边界"——用 lint 把它变成
# 编译期错误，而不是靠人审查。
[workspace.lints.rust]
# 在 unsafe fn 里做危险操作必须显式写 unsafe 块：防止"整个函数是 unsafe
# 所以随便调"这种把安全边界糊掉的做法。
unsafe_op_in_unsafe_fn = "deny"
# 未使用的 unsafe 块是危险信号：说明作者以为某处需要 unsafe 但其实不需要，
# 通常意味着对安全边界的理解有偏差。
unused_unsafe = "deny"

[workspace.lints.clippy]
# 把裸指针解引用、跨 FFI 传裸指针这类操作单独拎出来审查。
undocumented_unsafe_blocks = "warn"
[workspace.package]
version = "1.0.2"
edition = "2021"
license = "Apache-2.0"

[dependencies]
nwflash-protection = { path = "crates/nwflash-protection" }
nwflash-tauri = { path = "crates/nwflash-tauri" }
tauri = { version = "2.0.3", features = ["wry"] }
tauri-plugin-dialog = "2.7.2"
# Tauri discovers permission manifests from direct application dependencies. Keep both
# automation plugins outside every production graph and activate them only for E2E builds.
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dev-dependencies]
futures = "0.3.34"
nwflash-application = { path = "crates/nwflash-application" }
nwflash-domain = { path = "crates/nwflash-domain" }
nwflash-infrastructure = { path = "crates/nwflash-infrastructure" }
nwflash-windows = { path = "crates/nwflash-windows" }
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.13"
wiremock = "0.6.5"

[features]
# Tauri production builds MUST enable this (embeds frontendDist assets instead of
# pointing the webview at build.devUrl). `tauri build` does it automatically; plain
# `cargo build --release` does NOT. DO NOT REMOVE. See 2026-09-06 localhost:5173 fix.
custom-protocol = ["tauri/custom-protocol"]
e2e = [
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
  "nwflash-tauri/e2e",
]
protected = ["nwflash-tauri/protected"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = "full"
split-debuginfo = "packed"
strip = "none"

[lints]
workspace = true
