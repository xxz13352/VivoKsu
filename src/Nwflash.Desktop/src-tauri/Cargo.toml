[package]
name = "nwflash-desktop"
version = "1.0.1"
edition = "2021"
description = "奶蛙Flash Desktop Workspace Root"

[workspace]
members = [
  "crates/nwflash-domain",
  "crates/nwflash-protection",
  "crates/nwflash-application",
  "crates/nwflash-infrastructure",
  "crates/nwflash-windows",
  "crates/nwflash-tauri",
]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
nwflash-protection = { path = "crates/nwflash-protection" }
nwflash-tauri = { path = "crates/nwflash-tauri" }
tauri = { version = "2.0.3", features = ["wry"] }
tauri-plugin-dialog = "2.7.2"
# Tauri discovers permission manifests from direct application dependencies. Keep both
# automation plugins outside every production graph and activate them only for E2E builds.
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dev-dependencies]
futures = "0.3.34"
nwflash-application = { path = "crates/nwflash-application" }
nwflash-domain = { path = "crates/nwflash-domain" }
nwflash-infrastructure = { path = "crates/nwflash-infrastructure" }
nwflash-windows = { path = "crates/nwflash-windows" }
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.13"
wiremock = "0.6.5"

[features]
e2e = [
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
  "nwflash-tauri/e2e",
]
protected = ["nwflash-tauri/protected"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = "full"
split-debuginfo = "packed"
strip = "none"
