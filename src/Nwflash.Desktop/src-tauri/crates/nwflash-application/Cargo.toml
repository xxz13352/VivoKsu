[package]
name = "nwflash-application"
version = "1.0.1"
edition = "2021"
description = "NWflash application orchestration and use cases"

[dependencies]
nwflash-domain = { path = "../nwflash-domain" }
nwflash-infrastructure = { path = "../nwflash-infrastructure" }
nwflash-windows = { path = "../nwflash-windows" }
futures = "0.3.31"
thiserror = "2.0.12"
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "time"] }
tokio-util = "0.7.13"
zip = "9.0.0-pre3"
serde = { version = "1.0.210", features = ["derive"] }

[dev-dependencies]
flate2 = "1.1.9"
zip4 = { package = "zip", version = "4.2.0" }
wiremock = "0.6.5"
