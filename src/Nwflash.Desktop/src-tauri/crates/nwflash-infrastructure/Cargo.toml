[package]
name = "nwflash-infrastructure"
version = "1.0.1"
edition = "2021"
description = "NWflash infrastructure adapters"

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
nwflash-domain = { path = "../nwflash-domain" }
nwflash-protection = { path = "../nwflash-protection" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.8", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
zip = "4.2.0"
sha2 = "0.10.8"
tokio = { version = "1.40.0", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = "0.7.13"
url = "2.5.3"
thiserror = "1.0.69"
urlencoding = "2.1.3"
flate2 = "1.1.9"
zstd = "0.13.3"
webpki-roots = "1.0.9"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
x509-parser = "0.18.0"
zeroize = "1.8.1"

[dev-dependencies]
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = "0.14.5"
serial_test = "3.2.0"
tempfile = "3.23.0"
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "net"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
wiremock = "0.6.2"
