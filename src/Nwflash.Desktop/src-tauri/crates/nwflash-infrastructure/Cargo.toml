[package]
name = "nwflash-infrastructure"
version = "1.0.1"
edition = "2021"
description = "NWflash infrastructure adapters"

[dependencies]
nwflash-domain = { path = "../nwflash-domain" }
reqwest = { version = "0.12.8", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
zip = "4.2.0"
sha2 = "0.10.8"
tokio = { version = "1.40.0", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = "0.7.13"
url = "2.5.3"
thiserror = "1.0.69"
urlencoding = "2.1.3"
flate2 = "1.1.9"
zstd = "0.13.3"
windows-sys = { version = "0.59.0", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.2"
