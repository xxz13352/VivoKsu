[package]
name = "nwflash-protection"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Synchronous signed-lease verification and protection decisions"
build = "build.rs"

[features]
default = []
vmp-sdk = []

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }
nwflash-domain = { path = "../nwflash-domain" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
