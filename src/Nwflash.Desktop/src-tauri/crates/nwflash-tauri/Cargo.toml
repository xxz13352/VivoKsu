[package]
name = "nwflash-tauri"
version = "1.0.1"
edition = "2021"
description = "Tauri host crate and command bridge"
autobins = false

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
protected = ["nwflash-protection/vmp-sdk"]

[dependencies]
nwflash-domain = { path = "../nwflash-domain" }
nwflash-infrastructure = { path = "../nwflash-infrastructure" }
nwflash-application = { path = "../nwflash-application" }
nwflash-protection = { path = "../nwflash-protection" }
nwflash-windows = { path = "../nwflash-windows" }
futures = "0.3.34"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.8"
tokio = { version = "1.40.0", features = ["fs", "sync", "time"] }
tokio-util = "0.7.13"
zeroize = "1.8.1"
tauri = { version = "2.0.3", features = ["wry"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

[dev-dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
tempfile = "3.23.0"
tokio = { version = "1.40.0", features = ["macros", "rt", "test-util", "time"] }
wiremock = "0.6.5"
zip4 = { package = "zip", version = "4.2.0" }
