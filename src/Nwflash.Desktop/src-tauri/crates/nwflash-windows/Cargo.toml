[package]
name = "nwflash-windows"
version = "1.0.1"
edition = "2021"
description = "Windows process and device integration adapters"

[dependencies]
nwflash-domain = { path = "../nwflash-domain" }
sevenz-rust = { version = "0.6.1", default-features = false }
sha2 = "0.10.8"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }
