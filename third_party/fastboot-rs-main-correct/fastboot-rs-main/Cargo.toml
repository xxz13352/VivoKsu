[workspace]
# VivoKsu embeds only the Android transport library. Excluding ksud keeps the
# desktop build independent of KernelSU's Git-hosted development dependency.
members = ["fastboot-exe"]
exclude = ["ksud"]
resolver = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
